<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Content-Security-Policy: what this page may load and talk to. Scripts
       only from this site and jsDelivr (the pinned supabase-js), network
       calls only to Divz's Supabase project. If anything ever slipped
       script into the page, the browser would refuse to run it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src https://wjeipxlnzixhzysrjbsb.supabase.co; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <title>Divz — Claim your items</title>
  <style>
    :root { --bg:#A8E6C9; --card:#fff; --border:#D5F3EE; --text:#0F1A14; --muted:#6B8984; --accent:#F2A65A; --good:#1E9E6A; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
           background:var(--bg); color:var(--text); line-height:1.5; }
    .wrap { max-width:560px; margin:0 auto; padding:24px 16px 140px; }
    h1 { font-size:24px; margin:0 0 4px; }
    .sub { color:#3c5b51; margin:0 0 20px; font-size:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin:12px 0; }
    label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; }
    input { width:100%; padding:13px 14px; font-size:16px; border:1px solid var(--border);
            border-radius:12px; background:#F7FCFB; color:var(--text); }
    button { font-family:inherit; font-size:16px; font-weight:700; border:0; border-radius:14px;
             padding:15px 18px; width:100%; background:var(--good); color:#fff; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .item { display:flex; align-items:center; gap:12px; background:var(--card);
            border:2px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer; }
    .item.mine { border-color:var(--good); background:#F2FBF7; }
    .item .name { flex:1; font-weight:600; }
    .item .price { font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700; }
    .item .who { display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:2px; }
    .tick { width:22px; height:22px; border-radius:50%; border:2px solid var(--border);
            display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; flex:none; }
    .item.mine .tick { background:var(--good); border-color:var(--good); }
    .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--border);
           padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
    .bar .inner { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
    .bar .total { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
    .bar .lbl { font-size:13px; color:var(--muted); font-weight:600; }
    .msg { padding:16px; border-radius:12px; background:var(--card); border:1px solid var(--border); }
    .err { color:#B4232B; }
    .muted { color:var(--muted); font-size:13px; }
    .pick { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card);
            color:var(--text); border:2px solid var(--border); border-radius:14px; padding:14px; margin-bottom:10px;
            font-weight:600; }
    .pick:active { border-color:var(--good); }
    .dot { width:12px; height:12px; border-radius:50%; flex:none; background:var(--accent); }
    .ghost { background:transparent; color:var(--good); border:2px dashed var(--border); }
    .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-variant-numeric:tabular-nums; }
    .row .of { color:var(--muted); font-size:12px; font-weight:400; }
    .row.total { border-top:1px solid var(--border); margin-top:6px; padding-top:10px; font-weight:800; font-size:18px; }
    .badge { display:inline-block; font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px;
             background:#E7F7EF; color:var(--good); margin-bottom:8px; }
    .badge.est { background:#FFF1E2; color:#9A5A12; }
    .hist { display:block; text-decoration:none; color:var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app"><div class="msg">Loading…</div></div>
  </div>
  <div class="bar" id="bar" hidden>
    <div class="inner">
      <div>
        <span class="lbl">Your total</span>
        <div class="total" id="total">$0.00</div>
        <div class="lbl" id="totalNote"></div>
      </div>
      <div class="muted" id="status"></div>
    </div>
  </div>

<script type="module" src="./claim.js"></script>
</body>
</html>
